<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welverdiend Accommodation — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --taupe:#8A7E68; --taupe-dark:#6B6151; --taupe-deep:#4A4436;
    --ink:#2B2A26; --ink-soft:#66604F; --line:#E5E0D2; --surface:#FAF8F3;
    --white:#FFFFFF; --danger:#A3402F; --success:#4B6B3C; --warning:#8A6A1F;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--surface);color:var(--ink);margin:0;padding:32px;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--taupe-deep);margin:0 0 4px;font-size:28px;}
  .sub{color:var(--ink-soft);font-size:13px;margin:0 0 24px;}
  .token-bar{display:flex;gap:8px;margin-bottom:24px;max-width:520px;}
  .token-bar input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:4px;font-size:13px;}
  .token-bar button{padding:9px 18px;border:none;border-radius:4px;background:var(--taupe-deep);color:var(--white);cursor:pointer;font-weight:600;font-size:13px;}
  .token-bar button#token-toggle{background:var(--white);color:var(--ink-soft);border:1px solid var(--line);padding:9px 14px;}
  .sync-warning{
    display:none;background:#FCEBEB;border:1px solid #E8B7AC;border-radius:6px;
    padding:12px 16px;margin-bottom:20px;font-size:13px;color:#7A2E20;
  }
  .sync-warning.show{display:block;}
  .sync-warning strong{display:block;margin-bottom:4px;}
  .sync-warning ul{margin:4px 0 0;padding-left:18px;}
  .filters{display:flex;gap:8px;margin-bottom:16px;}
  .filters button{padding:7px 14px;border:1px solid var(--line);border-radius:20px;background:var(--white);cursor:pointer;font-size:12.5px;color:var(--ink-soft);}
  .filters button.active{background:var(--taupe-deep);color:var(--white);border-color:var(--taupe-deep);}
  .cards{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:16px 20px;}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .card-head h3{font-family:'Cormorant Garamond',serif;font-size:19px;margin:0;font-weight:600;}
  .card-head .dates{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .status{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;height:fit-content;}
  .status.requested{background:#F5EAD2;color:var(--warning);}
  .status.awaiting_payment{background:#EAE3F5;color:#5A3E99;}
  .status.submitted{background:#DCEAF5;color:#2A5F8A;}
  .status.confirmed{background:#E5EEDF;color:var(--success);}
  .status.rejected{background:#F5E1DC;color:var(--danger);}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0;font-size:13px;}
  .detail-grid .label{color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;}
  .extras-list{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .total{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--taupe-deep);}
  .actions{display:flex;gap:8px;margin-top:14px;}
  .actions button{padding:7px 14px;border:none;border-radius:4px;font-size:12.5px;cursor:pointer;font-weight:600;}
  .btn-confirm{background:var(--success);color:white;}
  .btn-reject{background:var(--danger);color:white;}
  .btn-approve{background:var(--taupe-deep);color:white;}
  .btn-proof{background:var(--surface);border:1px solid var(--line) !important;color:var(--ink);}
  .waiting-note{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-top:12px;}
  #empty{color:var(--ink-soft);font-size:13px;padding:20px;}
  .notes{font-size:12.5px;color:var(--ink-soft);margin-top:8px;font-style:italic;}
  .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line);}
  .tabs button{padding:9px 4px;margin-right:20px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--ink-soft);border-bottom:2px solid transparent;font-weight:500;}
  .tabs button.active{color:var(--taupe-deep);border-bottom-color:var(--taupe-deep);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .unit-block{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:16px 20px;margin-bottom:16px;}
  .unit-block h2{font-family:'Cormorant Garamond',serif;font-size:20px;margin:0 0 12px;font-weight:600;color:var(--taupe-deep);}
  .range-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .range-row:last-child{border-bottom:none;}
  .range-dates{font-size:13.5px;font-weight:500;}
  .range-source{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .btn-unblock{padding:6px 12px;border:none;border-radius:4px;font-size:12px;cursor:pointer;font-weight:600;background:var(--surface);border:1px solid var(--line) !important;color:var(--ink);}
  .btn-reblock{padding:6px 12px;border:none;border-radius:4px;font-size:12px;cursor:pointer;font-weight:600;background:var(--danger);color:white;}
  .override-tag{display:inline-block;background:#EAE3F5;color:#5A3E99;font-size:11px;padding:2px 8px;border-radius:10px;margin-top:4px;}
  .override-form{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .override-form .field{display:flex;flex-direction:column;gap:4px;}
  .override-form label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .override-form input,.override-form select{padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:13px;}
  .no-ranges{font-size:13px;color:var(--ink-soft);font-style:italic;}
  .settings-field{margin-bottom:14px;}
  .settings-field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--ink);}
  .settings-field input,.settings-field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:4px;font-size:13.5px;font-family:'Inter',sans-serif;}
  .settings-field textarea{min-height:70px;resize:vertical;}
  .settings-row{display:flex;gap:12px;}
  .settings-row .settings-field{flex:1;}
  .extra-row{display:flex;gap:8px;align-items:end;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .extra-row .settings-field{margin-bottom:0;min-width:120px;}
  .extra-row .settings-field.grow{flex:1;min-width:160px;}
  .btn-remove-extra{background:var(--danger);color:white;border:none;border-radius:4px;padding:8px 10px;cursor:pointer;font-size:12px;height:36px;}
  .btn-add-extra{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--ink);margin-top:6px;}
  .btn-save-settings{background:var(--success);color:white;border:none;border-radius:4px;padding:10px 22px;cursor:pointer;font-size:13.5px;font-weight:600;margin-top:20px;}
  .settings-msg{font-size:13px;margin-top:10px;}
  .settings-msg.success{color:var(--success);}
  .settings-msg.error{color:var(--danger);}
</style>
</head>
<body>

<h1>Welverdiend Accommodation — Bookings</h1>
<p class="sub">Approve requests first, then confirm once the guest has uploaded proof of payment.</p>

<div class="sync-warning" id="sync-warning"></div>

<div class="token-bar">
  <input type="password" id="token" placeholder="Admin token" autocomplete="off" name="welverdiend-admin-token-field" data-lpignore="true" data-1p-ignore>
  <button type="button" id="token-toggle" title="Show/hide token">Show</button>
  <button id="load-btn">Load bookings</button>
</div>

<div class="tabs">
  <button class="active" data-tab="bookings">Bookings</button>
  <button data-tab="calendar">Calendar</button>
  <button data-tab="settings">Settings</button>
</div>

<div class="tab-panel active" id="panel-bookings">
  <div class="filters">
    <button class="active" data-status="">All</button>
    <button data-status="requested">New requests</button>
    <button data-status="awaiting_payment">Awaiting payment</button>
    <button data-status="submitted">Ready to confirm</button>
    <button data-status="confirmed">Confirmed</button>
    <button data-status="rejected">Rejected</button>
  </div>
  <div class="cards" id="cards"></div>
  <div id="empty">Enter your admin token and load bookings.</div>
</div>

<div class="tab-panel" id="panel-calendar">
  <div id="calendar-content">
    <p class="no-ranges">Enter your admin token above and open this tab to load the calendar.</p>
  </div>
</div>

<div class="tab-panel" id="panel-settings">
  <div id="settings-content">
    <p class="no-ranges">Enter your admin token above and open this tab to load settings.</p>
  </div>
</div>

<script>
  const API_BASE = "https://welverdiend-booking-478269051372.europe-west1.run.app"; // same backend URL as the widget
  let currentStatus = "";

  document.querySelectorAll(".filters button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentStatus = btn.dataset.status;
      loadBookings();
    };
  });

  document.getElementById("load-btn").onclick = loadBookings;

  document.querySelectorAll(".tabs button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");
      if(btn.dataset.tab === "calendar" && token()) loadCalendar();
      if(btn.dataset.tab === "settings" && token()) loadSettings();
    };
  });
  document.getElementById("token-toggle").onclick = () => {
    const input = document.getElementById("token");
    const btn = document.getElementById("token-toggle");
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    btn.textContent = showing ? "Show" : "Hide";
  };
  function token(){ return document.getElementById("token").value.trim(); }
  function esc(s){ const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
  function rand(n){ return `R${Number(n||0).toFixed(2)}`; }

  const feedLabels = { airbnb: "Airbnb", "booking.com": "Booking.com", lekkeslaap: "Lekkeslaap" };

  async function checkFeedHealth(){
    try{
      const res = await fetch(`${API_BASE}/api/admin/calendar`, { headers: { "x-admin-token": token() } });
      const data = await res.json();
      if(data.ok) renderFeedWarnings(data.units);
    }catch(err){
      // Silent — this is a background convenience check, the main
      // Bookings/Calendar loads already surface real connection errors.
    }
  }

  function renderFeedWarnings(unitsData){
    const banner = document.getElementById("sync-warning");
    const problems = [];
    (unitsData || []).forEach(u => {
      const health = u.feedHealth || {};
      Object.keys(health).forEach(source => {
        const h = health[source];
        if(h && h.ok === false){
          problems.push(`${esc(u.unitName)} — ${feedLabels[source] || source}: ${esc(h.error || 'not syncing')}`);
        }
      });
    });
    if(problems.length === 0){
      banner.classList.remove("show");
      banner.innerHTML = "";
      return;
    }
    banner.classList.add("show");
    banner.innerHTML = `<strong>⚠ ${problems.length} calendar feed${problems.length===1?" isn't":"s aren't"} syncing — dates from ${problems.length===1?"this platform":"these platforms"} may be missing from your calendar:</strong><ul>${problems.map(p => `<li>${p}</li>`).join("")}</ul><div style="margin-top:6px;">This usually means an export link expired or was regenerated on the platform's side — get a fresh export link from that platform and update it in backend/config/units.js.</div>`;
  }


  async function loadBookings(){
    if(!token()){ alert("Enter your admin token first."); return; }
    checkFeedHealth();
    const url = `${API_BASE}/api/admin/bookings${currentStatus ? "?status="+currentStatus : ""}`;
    let res, data;
    try{
      res = await fetch(url, { headers: { "x-admin-token": token() } });
      data = await res.json();
    }catch(err){
      document.getElementById("empty").style.display = "block";
      document.getElementById("empty").textContent = "Could not reach the server — check your internet connection and the API_BASE address in this file.";
      console.error("[Welverdiend admin] network error:", err);
      return;
    }
    const cards = document.getElementById("cards");
    const empty = document.getElementById("empty");
    cards.innerHTML = "";

    if(!data.ok){
      empty.style.display = "block";
      empty.textContent = `Could not load bookings — check your admin token. (Sent a token that's ${token().length} characters long, HTTP status ${res.status}.)`;
      console.error("[Welverdiend admin] auth/load failed:", { status: res.status, tokenLength: token().length, response: data });
      return;
    }
    if(data.bookings.length === 0){
      empty.style.display = "block";
      empty.textContent = "No bookings found for this filter.";
      return;
    }
    empty.style.display = "none";

    data.bookings.forEach(b => {
      const guestsLine = `${b.adults || 1} adult${(b.adults||1)===1?"":"s"}` + (b.children ? `, ${b.children} child${b.children===1?"":"ren"}${b.childrenAges ? " ("+esc(b.childrenAges)+")" : ""}` : "");
      const petsLine = b.hasPets ? (esc(b.petDetails) || "Yes") : "No";
      const extrasLines = (b.lineItems || []).slice(1).map(li => `${esc(li.label)} — ${rand(li.amount)}`).join("<br>") || "None";
      const statusLabels = { requested: "New request", awaiting_payment: "Awaiting deposit", submitted: "Ready to confirm", confirmed: "Confirmed", rejected: "Rejected" };
      const balanceLabels = { unpaid: "Balance not yet paid", submitted: "Balance proof received", paid: "Balance paid" };

      let actionsHtml = "";
      if(b.status === "requested"){
        actionsHtml = `<button class="btn-approve" data-id="${b.id}" data-action="approve">Approve — dates are available</button><button class="btn-reject" data-id="${b.id}" data-action="decline">Decline</button>`;
      } else if(b.status === "awaiting_payment"){
        actionsHtml = `<button class="btn-reject" data-id="${b.id}" data-action="decline">Cancel request</button>`;
      } else if(b.status === "submitted"){
        actionsHtml = `<button class="btn-proof" data-id="${b.id}" data-action="proof">View deposit proof</button><button class="btn-confirm" data-id="${b.id}" data-action="confirm">Confirm booking</button><button class="btn-reject" data-id="${b.id}" data-action="reject">Reject</button>`;
      } else if(b.status === "confirmed"){
        const parts = [];
        parts.push(`<button class="btn-proof" data-id="${b.id}" data-action="invoice">Download invoice</button>`);
        if(b.proofOfPaymentPath) parts.push(`<button class="btn-proof" data-id="${b.id}" data-action="proof">View deposit proof</button>`);
        if(b.balanceStatus === "unpaid"){
          parts.push(`<button class="btn-proof" data-id="${b.id}" data-action="remind">Send balance reminder</button>`);
          parts.push(`<button class="btn-confirm" data-id="${b.id}" data-action="mark-paid">Mark balance received</button>`);
        } else if(b.balanceStatus === "submitted"){
          if(b.balanceProofPath) parts.push(`<button class="btn-proof" data-id="${b.id}" data-action="balance-proof">View balance proof</button>`);
          parts.push(`<button class="btn-confirm" data-id="${b.id}" data-action="mark-paid">Mark balance received</button>`);
        } else if(b.balanceStatus === "paid" && b.balanceProofPath){
          parts.push(`<button class="btn-proof" data-id="${b.id}" data-action="balance-proof">View balance proof</button>`);
        }
        actionsHtml = parts.join("");
      }
      actionsHtml += `<button class="btn-reject" data-id="${b.id}" data-action="delete">Delete</button>`;

      const knownStatus = ["requested","awaiting_payment","submitted","confirmed","rejected"].includes(b.status);

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-head">
          <div>
            <h3>${esc(b.guestName)} · ${esc(b.unitId)}</h3>
            <div class="dates">${b.checkIn} → ${b.checkOut} (${b.nights || ""} night${b.nights===1?"":"s"})${b.arrivalTime ? " · arriving " + esc(b.arrivalTime) : ""}</div>
          </div>
          <span class="status ${knownStatus ? b.status : ''}">${statusLabels[b.status] || `Unrecognized status: ${esc(b.status)}`}</span>
        </div>
        ${!knownStatus ? `<div class="notes">This booking has a status from an older version of the system and won't show any action buttons except Delete. Safe to delete if it's old test data.</div>` : ""}
        <div class="detail-grid">
          <div><div class="label">Contact</div>${esc(b.email)}<br>${esc(b.phone)}</div>
          <div><div class="label">Guests</div>${guestsLine}</div>
          <div><div class="label">Pets</div>${petsLine}</div>
          <div><div class="label">Extras</div><div class="extras-list">${extrasLines}</div></div>
          <div>
            <div class="label">Payment</div>
            <div class="total">${rand(b.totalAmount)} total</div>
            <div class="range-source">Deposit ${rand(b.depositAmount)} · Balance ${rand(b.balanceAmount)}${b.status === 'confirmed' ? ` — ${balanceLabels[b.balanceStatus] || b.balanceStatus}` : ''}</div>
          </div>
        </div>
        ${b.notes ? `<div class="notes">"${esc(b.notes)}"</div>` : ""}
        ${b.status === "awaiting_payment" ? `<div class="waiting-note">Waiting for the guest to upload deposit proof of payment.</div>` : ""}
        <div class="actions">${actionsHtml}</div>
      `;
      cards.appendChild(card);
    });

    cards.querySelectorAll("[data-action='proof']").forEach(btn => btn.onclick = () => viewProof(btn.dataset.id, "deposit"));
    cards.querySelectorAll("[data-action='balance-proof']").forEach(btn => btn.onclick = () => viewProof(btn.dataset.id, "balance"));
    cards.querySelectorAll("[data-action='invoice']").forEach(btn => btn.onclick = () => viewProof(btn.dataset.id, "invoice"));
    cards.querySelectorAll("[data-action='approve']").forEach(btn => btn.onclick = () => decide(btn.dataset.id, "approve"));
    cards.querySelectorAll("[data-action='confirm']").forEach(btn => btn.onclick = () => decide(btn.dataset.id, "confirm"));
    cards.querySelectorAll("[data-action='decline']").forEach(btn => btn.onclick = () => decide(btn.dataset.id, "decline"));
    cards.querySelectorAll("[data-action='reject']").forEach(btn => btn.onclick = () => decide(btn.dataset.id, "reject"));
    cards.querySelectorAll("[data-action='remind']").forEach(btn => btn.onclick = () => balanceAction(btn.dataset.id, "remind"));
    cards.querySelectorAll("[data-action='mark-paid']").forEach(btn => btn.onclick = () => balanceAction(btn.dataset.id, "mark-paid"));
    cards.querySelectorAll("[data-action='delete']").forEach(btn => btn.onclick = () => deleteBooking(btn.dataset.id));
  }


  async function viewProof(id, type){
    const path = type === "balance" ? `balance-proof` : type === "invoice" ? `invoice` : `proof`;
    try{
      const res = await fetch(`${API_BASE}/api/admin/bookings/${id}/${path}`, { headers: { "x-admin-token": token() } });
      if(!res.ok){
        let errMsg = `Could not load that file (status ${res.status}).`;
        try{ const errData = await res.json(); if(errData.error) errMsg = errData.error; }catch(e){}
        alert(errMsg);
        return;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
    }catch(err){
      alert("Could not reach the server to load that file.");
    }
  }

  async function decide(id, action){
    const labels = { approve: "Approve this request (confirms the dates are available and emails the guest)", decline: "Decline this request", confirm: "Give final confirmation (this blocks the dates on the calendar)", reject: "Reject this booking" };
    let reason = "";
    if(action === "decline" || action === "reject"){
      reason = prompt("Optional: add a short reason to include in the email to the guest (leave blank to skip).") || "";
    }
    if(!confirm(labels[action] + "?")) return;
    const res = await fetch(`${API_BASE}/api/admin/bookings/${id}/${action}`, {
      method: "POST",
      headers: { "x-admin-token": token(), "Content-Type": "application/json" },
      body: JSON.stringify({ reason })
    });
    const data = await res.json();
    if(data.ok) loadBookings();
    else alert(data.error || "Action failed.");
  }

  async function balanceAction(id, action){
    const labels = { remind: "Email the guest a reminder to pay their final balance?", "mark-paid": "Mark the balance as received? Only do this once you've actually confirmed payment." };
    if(!confirm(labels[action])) return;
    const res = await fetch(`${API_BASE}/api/admin/bookings/${id}/balance/${action}`, {
      method: "POST",
      headers: { "x-admin-token": token() }
    });
    const data = await res.json();
    if(data.ok) loadBookings();
    else alert(data.error || "Action failed.");
  }

  async function deleteBooking(id){
    if(!confirm("Permanently delete this booking record? This can't be undone, and no email is sent to the guest.")) return;
    const res = await fetch(`${API_BASE}/api/admin/bookings/${id}`, {
      method: "DELETE",
      headers: { "x-admin-token": token() }
    });
    const data = await res.json();
    if(data.ok) loadBookings();
    else alert(data.error || "Could not delete that booking.");
  }


  const sourceLabels = { airbnb: "Airbnb", "booking.com": "Booking.com", lekkeslaap: "Lekkeslaap", direct: "Direct booking" };

  async function loadCalendar(){
    const content = document.getElementById("calendar-content");
    if(!token()){ alert("Enter your admin token first."); return; }
    let res, data;
    try{
      res = await fetch(`${API_BASE}/api/admin/calendar`, { headers: { "x-admin-token": token() } });
      data = await res.json();
    }catch(err){
      content.innerHTML = `<p class="no-ranges">Could not reach the server.</p>`;
      return;
    }
    if(!data.ok){
      content.innerHTML = `<p class="no-ranges">Could not load the calendar — check your admin token.</p>`;
      return;
    }
    renderFeedWarnings(data.units);

    content.innerHTML = data.units.map(u => {
      const rows = (u.busyRanges || []).map(r => {
        const names = (r.sources||[]).map(s => sourceLabels[s] || s).join(" + ");
        const who = (r.details||[]).length ? ` — ${r.details.map(esc).join(", ")}` : "";
        return `
          <div class="range-row">
            <div>
              <div class="range-dates">${r.start} → ${r.end}</div>
              <div class="range-source">Booked via ${names}${who}</div>
            </div>
            <button class="btn-unblock" data-unit="${u.unitId}" data-start="${r.start}" data-end="${r.end}">Unblock</button>
          </div>
        `;
      }).join("") || `<p class="no-ranges">No booked dates right now.</p>`;

      const overrideRows = (u.overrides || []).map(o => `
        <div class="range-row">
          <div>
            <div class="range-dates">${o.start} → ${o.end}</div>
            <div class="range-source">Manually unblocked${o.reason ? " — " + esc(o.reason) : ""}</div>
          </div>
          <button class="btn-reblock" data-id="${o.id}">Re-block</button>
        </div>
      `).join("");

      return `
        <div class="unit-block">
          <h2>${esc(u.unitName)}</h2>
          ${rows}
          ${overrideRows ? `<div style="margin-top:12px;"><div class="range-source" style="margin-bottom:6px;">Active manual unblocks:</div>${overrideRows}</div>` : ""}
          <div class="override-form">
            <div class="field"><label>From</label><input type="date" id="ov-start-${u.unitId}"></div>
            <div class="field"><label>To</label><input type="date" id="ov-end-${u.unitId}"></div>
            <div class="field"><label>Reason (optional)</label><input type="text" id="ov-reason-${u.unitId}" placeholder="e.g. cancelled, sync error" style="width:200px;"></div>
            <button class="btn-unblock" data-manual-unit="${u.unitId}">Unblock these dates</button>
          </div>
        </div>
      `;
    }).join("");

    content.querySelectorAll("[data-unit]").forEach(btn => {
      btn.onclick = () => unblockRange(btn.dataset.unit, btn.dataset.start, btn.dataset.end);
    });
    content.querySelectorAll("[data-id]").forEach(btn => {
      btn.onclick = () => reblockRange(btn.dataset.id);
    });
    content.querySelectorAll("[data-manual-unit]").forEach(btn => {
      btn.onclick = () => {
        const unitId = btn.dataset.manualUnit;
        const start = document.getElementById(`ov-start-${unitId}`).value;
        const end = document.getElementById(`ov-end-${unitId}`).value;
        const reason = document.getElementById(`ov-reason-${unitId}`).value;
        if(!start || !end || start >= end){ alert("Pick a valid From/To date range first."); return; }
        unblockRange(unitId, start, end, reason);
      };
    });
  }

  async function unblockRange(unitId, start, end, reason){
    if(!confirm(`Unblock ${start} → ${end} for this unit? This only affects your own calendar — it does not cancel anything on Airbnb, Booking.com or Lekkeslaap themselves.`)) return;
    const res = await fetch(`${API_BASE}/api/admin/overrides`, {
      method: "POST",
      headers: { "x-admin-token": token(), "Content-Type": "application/json" },
      body: JSON.stringify({ unitId, start, end, reason: reason || "" })
    });
    const data = await res.json();
    if(data.ok) loadCalendar();
    else alert(data.error || "Could not unblock those dates.");
  }

  async function reblockRange(overrideId){
    if(!confirm("Remove this manual unblock? The dates will go back to blocked if the source booking is still there.")) return;
    const res = await fetch(`${API_BASE}/api/admin/overrides/${overrideId}`, {
      method: "DELETE",
      headers: { "x-admin-token": token() }
    });
    const data = await res.json();
    if(data.ok) loadCalendar();
    else alert(data.error || "Could not remove that unblock.");
  }

  let settingsState = null;
  let extraCounter = 0;

  async function loadSettings(){
    const content = document.getElementById("settings-content");
    if(!token()){ alert("Enter your admin token first."); return; }
    let res, data;
    try{
      res = await fetch(`${API_BASE}/api/admin/settings`, { headers: { "x-admin-token": token() } });
      data = await res.json();
    }catch(err){
      content.innerHTML = `<p class="no-ranges">Could not reach the server.</p>`;
      return;
    }
    if(!data.ok){
      content.innerHTML = `<p class="no-ranges">Could not load settings — check your admin token.</p>`;
      return;
    }
    settingsState = data.settings;
    renderSettings();
  }

  function renderSettings(){
    const content = document.getElementById("settings-content");
    const s = settingsState;

    const unitBlocks = s.units.map(u => `
      <div class="unit-block">
        <h2>${esc(u.name)}</h2>
        <div class="settings-row">
          <div class="settings-field"><label>Nightly rate (R)</label><input type="number" id="price-${u.id}" value="${u.pricePerNight}"></div>
          <div class="settings-field"><label>Beds</label><input type="number" id="beds-${u.id}" value="${u.beds ?? ''}"></div>
          <div class="settings-field"><label>Bathrooms</label><input type="number" id="baths-${u.id}" value="${u.bathrooms ?? ''}"></div>
        </div>
        <div class="settings-field"><label>Description</label><textarea id="desc-${u.id}">${esc(u.description)}</textarea></div>
        <div class="settings-field"><label>Amenities (comma-separated)</label><input type="text" id="amen-${u.id}" value="${esc((u.amenities||[]).join(', '))}"></div>
      </div>
    `).join("");

    content.innerHTML = `
      ${unitBlocks}
      <div class="unit-block">
        <h2>Extras</h2>
        <div id="extras-list"></div>
        <button type="button" class="btn-add-extra" id="add-extra-btn">+ Add an extra</button>
      </div>
      <div class="unit-block">
        <h2>Bank details</h2>
        <div class="settings-field"><label>Shown to guests once approved, and in the approval email</label><textarea id="bank-details">${esc(s.bankDetails)}</textarea></div>
        <div class="settings-field"><label>Booking-request notification email</label><input type="text" id="owner-email" value="${esc(s.ownerNotificationEmail)}"></div>
        <button type="button" class="btn-add-extra" id="test-email-btn">Send test email to this address</button>
        <div class="settings-msg" id="test-email-msg"></div>
      </div>
      <button class="btn-save-settings" id="save-settings-btn">Save settings</button>
      <div class="settings-msg" id="settings-msg"></div>
    `;

    document.getElementById("test-email-btn").onclick = sendTestEmail;
    renderExtrasList(s.extras);
    document.getElementById("add-extra-btn").onclick = () => {
      const newExtra = { id: `extra_${Date.now()}`, label: "", description: "", price: 0, type: "flat", max: 5 };
      settingsState.extras = [...readExtrasFromForm(), newExtra];
      renderExtrasList(settingsState.extras);
    };
    document.getElementById("save-settings-btn").onclick = saveSettingsForm;
  }

  function renderExtrasList(extrasList){
    const wrap = document.getElementById("extras-list");
    wrap.innerHTML = extrasList.map((ex, i) => `
      <div class="extra-row" data-idx="${i}">
        <div class="settings-field grow"><label>Label</label><input type="text" class="ex-label" value="${esc(ex.label)}"></div>
        <div class="settings-field grow"><label>Description</label><input type="text" class="ex-desc" value="${esc(ex.description||'')}"></div>
        <div class="settings-field"><label>Price (R)</label><input type="number" class="ex-price" value="${ex.price}"></div>
        <div class="settings-field"><label>Type</label>
          <select class="ex-type">
            <option value="flat" ${ex.type==='flat'?'selected':''}>Once (checkbox)</option>
            <option value="qty" ${ex.type==='qty'?'selected':''}>Per quantity</option>
          </select>
        </div>
        <div class="settings-field"><label>Max qty</label><input type="number" class="ex-max" value="${ex.max||5}"></div>
        <button type="button" class="btn-remove-extra" data-idx="${i}">Remove</button>
      </div>
    `).join("") || `<p class="no-ranges">No extras yet — add one below.</p>`;

    wrap.querySelectorAll(".btn-remove-extra").forEach(btn => {
      btn.onclick = () => {
        const list = readExtrasFromForm();
        list.splice(Number(btn.dataset.idx), 1);
        settingsState.extras = list;
        renderExtrasList(list);
      };
    });
  }

  function readExtrasFromForm(){
    return Array.from(document.querySelectorAll(".extra-row")).map((row, i) => ({
      id: settingsState.extras[i] ? settingsState.extras[i].id : `extra_${Date.now()}_${i}`,
      label: row.querySelector(".ex-label").value,
      description: row.querySelector(".ex-desc").value,
      price: Number(row.querySelector(".ex-price").value) || 0,
      type: row.querySelector(".ex-type").value,
      max: Number(row.querySelector(".ex-max").value) || 5
    }));
  }

  async function saveSettingsForm(){
    const msg = document.getElementById("settings-msg");
    const btn = document.getElementById("save-settings-btn");
    const units = settingsState.units.map(u => ({
      id: u.id,
      pricePerNight: Number(document.getElementById(`price-${u.id}`).value) || 0,
      beds: Number(document.getElementById(`beds-${u.id}`).value) || null,
      bathrooms: Number(document.getElementById(`baths-${u.id}`).value) || null,
      description: document.getElementById(`desc-${u.id}`).value,
      amenities: document.getElementById(`amen-${u.id}`).value.split(",").map(a => a.trim()).filter(Boolean),
      photo: u.photo
    }));
    const extras = readExtrasFromForm();
    const bankDetails = document.getElementById("bank-details").value;
    const ownerNotificationEmail = document.getElementById("owner-email").value;

    btn.disabled = true; btn.textContent = "Saving…";
    try{
      const res = await fetch(`${API_BASE}/api/admin/settings`, {
        method: "POST",
        headers: { "x-admin-token": token(), "Content-Type": "application/json" },
        body: JSON.stringify({ units, extras, bankDetails, ownerNotificationEmail })
      });
      const data = await res.json();
      if(data.ok){
        msg.className = "settings-msg success";
        msg.textContent = "Saved — changes are live immediately, no redeploy needed.";
        loadSettings();
      } else {
        msg.className = "settings-msg error";
        msg.textContent = data.error || "Could not save settings.";
      }
    }catch(err){
      msg.className = "settings-msg error";
      msg.textContent = "Could not reach the server.";
    }
    btn.disabled = false; btn.textContent = "Save settings";
  }

  async function sendTestEmail(){
    const msg = document.getElementById("test-email-msg");
    const to = document.getElementById("owner-email").value;
    const btn = document.getElementById("test-email-btn");
    msg.className = "settings-msg";
    msg.textContent = "";
    btn.disabled = true; btn.textContent = "Sending…";
    try{
      const res = await fetch(`${API_BASE}/api/admin/test-email`, {
        method: "POST",
        headers: { "x-admin-token": token(), "Content-Type": "application/json" },
        body: JSON.stringify({ to })
      });
      const data = await res.json();
      if(data.ok){
        msg.className = "settings-msg success";
        msg.textContent = `Test email sent to ${data.to} — check that inbox (and spam folder) in a minute or two.`;
      } else {
        msg.className = "settings-msg error";
        msg.textContent = data.error || "Could not send the test email.";
      }
    }catch(err){
      msg.className = "settings-msg error";
      msg.textContent = "Could not reach the server.";
    }
    btn.disabled = false; btn.textContent = "Send test email to this address";
  }
</script>

</body>
</html>
