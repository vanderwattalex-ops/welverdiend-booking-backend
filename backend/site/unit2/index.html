<style>
:root{
  --brown:#5b4632; --brown-dk:#43331f; --olive:#6b7a3a; --olive-dk:#55622c; --olive-soft:#eef0e2;
  --bg:#faf7f1; --card:#ffffff; --ink:#231c14; --muted:#5e5446; --line:#e6ddcf; --cream:#f6efe2;
  --warn-bg:#fff4e0; --warn:#8a4b00; --danger:#a3321f;
  --radius:16px; --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17130f; --card:#221c16; --ink:#f3ece1; --muted:#c9bcaa; --line:#3a3027; --cream:#2a221a;
    --olive:#a9b86b; --olive-dk:#c2cf86; --olive-soft:#2b2f1c; --warn-bg:#33270f; --warn:#f3c477; --danger:#ff8a73;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--sans)}
img{max-width:100%;display:block}
a{color:var(--olive-dk)}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .5em;font-weight:700}
h2{font-size:1.75rem;color:var(--brown)}
@media (prefers-color-scheme:dark){h2{color:#e8d6bd}}
h3{font-size:1.2rem}
p{margin:0 0 .9em}
ul,ol{margin:0 0 1em;padding-left:1.3em}
li{margin:.3em 0}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--olive);outline-offset:2px;border-radius:6px}

/* hero */
.hero{position:relative;min-height:78vh;min-height:78svh;display:flex;align-items:flex-end;color:#fff;background:#3b2d1f}
.hero picture,.hero img.bg{position:absolute;inset:0;width:100%;height:100%}
.hero img.bg{object-fit:cover;object-position:50% 60%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,20,10,.15) 0%,rgba(30,20,10,.25) 40%,rgba(30,20,10,.85) 100%)}
.hero .inner{position:relative;z-index:1;width:100%;padding:28px 18px 26px;max-width:760px;margin:0 auto}
.hero .logo{width:220px;max-width:62%;height:auto;margin-bottom:14px;filter:brightness(0) invert(1) drop-shadow(0 1px 6px rgba(0,0,0,.45))}
.hero h1{font-size:clamp(2.1rem,8vw,3.2rem);margin:0 0 .15em;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.hero .sub{font-size:1.05rem;margin:0 0 18px;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.cta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;border:0;font:700 1rem/1.2 var(--sans);text-decoration:none;cursor:pointer;color:#fff;background:var(--olive-dk);-webkit-tap-highlight-color:transparent}
@media (prefers-color-scheme:dark){.btn{color:#17130f}}
.btn:active{transform:translateY(1px)}
.cta .btn{flex-direction:column;gap:4px;min-height:74px;font-size:.95rem;text-align:center;border-radius:14px}
.cta .btn svg{width:26px;height:26px}
.btn.wa{background:#1f8c4e;color:#fff}
.btn.call{background:#fff;color:var(--brown-dk)}
.btn.dir{background:var(--brown);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.btn.ghost{background:transparent;color:var(--olive-dk);box-shadow:inset 0 0 0 2px var(--olive)}
.btn.small{min-height:44px;padding:8px 14px;font-size:.95rem}
.hero .num{margin:12px 0 0;font-size:1rem}
.hero .num a{display:inline-block;padding:10px 0;color:#fff;font-weight:800;text-decoration:none;border-bottom:2px solid rgba(255,255,255,.5)}

.lang{position:absolute;top:12px;right:12px;z-index:2;display:flex;background:rgba(30,20,10,.55);border-radius:999px;padding:3px;backdrop-filter:blur(4px)}
.lang button{min-height:44px;min-width:44px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#fff;font:700 .9rem/1 var(--sans);cursor:pointer}
.lang button[aria-pressed="true"]{background:#f6efe2;color:var(--brown-dk)}
/* sticky nav */
.nav{position:sticky;top:0;z-index:20;background:var(--brown);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.nav ul{display:flex;gap:6px;overflow-x:auto;list-style:none;margin:0 auto;padding:8px 12px;max-width:980px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.nav ul::-webkit-scrollbar{display:none}
.nav li{margin:0;flex:0 0 auto;scroll-snap-align:start}
.nav a{display:flex;align-items:center;min-height:44px;padding:0 15px;border-radius:999px;color:#f6efe2;text-decoration:none;font-weight:700;font-size:.95rem;white-space:nowrap}
.nav a[aria-current="true"]{background:#f6efe2;color:var(--brown-dk)}

/* sections */
main{padding-bottom:10px}
section{padding:34px 0 8px;scroll-margin-top:64px}
section + section{border-top:1px solid var(--line)}
.eyebrow{display:block;font:800 .78rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--olive);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{margin-bottom:.4em}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:700;margin:0 0 16px}
.note.ok{background:var(--olive-soft);color:var(--olive-dk)}
.note.danger{background:rgba(163,50,31,.1);color:var(--danger)}
ol.steps{list-style:none;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:4px 0 4px 46px;margin:0 0 10px;min-height:34px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:32px;height:32px;border-radius:50%;background:var(--olive-dk);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme:dark){ol.steps li::before{color:#17130f}}
.two{display:grid;gap:14px}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}
.remote{display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}
.remote div{display:flex;align-items:center;gap:12px;font-weight:700}
.dot{flex:0 0 auto;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.dot.blue{background:#2f6fd6}.dot.red{background:#d33a2c}
figure{margin:0 0 16px}
figure img{width:100%;height:auto;border-radius:var(--radius);background:var(--cream)}
figcaption{font-size:.9rem;color:var(--muted);margin-top:6px}
.code-box{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--cream);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.code-box .val{font:800 1.15rem/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;flex:1 1 180px}
.label{display:block;font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.toast{max-width:90vw;text-align:center;position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:#1e1912;color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.copy-btn[data-copied]::after{content:" ✓"}

/* weather */
.wx-now{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.wx-now .big{font:700 3rem/1 var(--serif)}
.wx-now .icon{font-size:3rem;line-height:1}
.wx-now .desc{font-weight:700}
.wx-meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:.95rem;margin-top:10px}
.wx-days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(86px,1fr);gap:8px;overflow-x:auto;padding:4px 2px 6px;margin-top:14px;scrollbar-width:thin}
.wx-day{background:var(--cream);border-radius:12px;padding:10px 6px;text-align:center}
.wx-day .d{font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wx-day .i{font-size:1.6rem;margin:4px 0}
.wx-day .t{font-weight:800}
.wx-day .t span{font-weight:400;color:var(--muted)}
.wx-day .r{font-size:.8rem;color:#2f6fd6}
@media (prefers-color-scheme:dark){.wx-day .r{color:#8fb6ff}}
.wx-updated{font-size:.85rem;color:var(--muted);margin-top:8px}

/* appliances */
details{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 12px;box-shadow:var(--shadow);overflow:hidden}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 16px;font:700 1.08rem/1.3 var(--sans)}
summary::-webkit-details-marker{display:none}
summary .ico{font-size:1.5rem;width:32px;text-align:center}
summary::after{content:"";margin-left:auto;width:12px;height:12px;border-right:3px solid var(--olive);border-bottom:3px solid var(--olive);transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
.det-body{padding:0 16px 16px;display:grid;gap:16px}
@media (min-width:640px){.det-body{grid-template-columns:220px 1fr;align-items:start}}
.det-body img{border-radius:12px;width:100%;max-width:280px;height:auto;margin:0 auto}
dl.kv{margin:0}
dl.kv dt{font-weight:800;margin-top:8px}
dl.kv dd{margin:0}

/* wildlife */
.animals{display:grid;gap:14px}
@media (min-width:640px){.animals{grid-template-columns:1fr 1fr}}
.animal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.animal img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background:var(--cream)}
.animal .b{padding:14px 16px 6px}
.animal .tag{font-style:italic;color:var(--muted);margin-bottom:.6em}
.animal ul{padding-left:1.1em;font-size:.97rem}

/* around */
.cat{margin:0 0 18px}
.cat h3{display:flex;align-items:center;gap:8px}
.place{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
.place:last-child{border-bottom:0}
.place a{font-weight:800;font-size:1.05rem;display:inline-flex;align-items:center;min-height:32px;text-decoration:none;border-bottom:2px solid var(--olive)}
.place p{margin:.2em 0 0;color:var(--muted)}

/* emergency */
.tel-list{list-style:none;padding:0;margin:0}
.tel-list li{margin:0}
.tel-list a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:10px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tel-list li:last-child a{border-bottom:0}
.tel-list .n{font:800 1.08rem/1.2 var(--sans);color:var(--olive-dk);white-space:nowrap}
.tel-list .n::before{content:"📞 "}

footer{background:var(--brown);color:#f6efe2;margin-top:30px;padding:34px 0 calc(34px + env(safe-area-inset-bottom))}
footer h2{color:#fff}
footer a{color:#fff}
footer .btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
footer .btn.light{background:#f6efe2;color:var(--brown-dk)}
footer .btn.outline{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
footer small{opacity:.8;display:block;margin-top:14px}
@media (min-width:900px){body{font-size:17.5px}.hero{min-height:70vh}}
@media (max-width:380px){.cta{gap:8px}.cta .btn{font-size:.88rem;padding:8px 6px}}
</style>

/* ---------- language ----------
   English is GUIDE itself; Afrikaans is GUIDE.af, which holds only the
   translated text. Anything not in GUIDE.af (photos, phone numbers, Wi-Fi
   details, the driver note) comes from the English version.
   Pick order: ?lang=af in the link, then the guest's last choice, then
   the phone's language. */
function merge(base, over) {
  if (over === undefined) return base;
  if (Array.isArray(base) && Array.isArray(over)) {
    const objs = base.length && base[0] && typeof base[0] === "object" && !Array.isArray(base[0]);
    return objs ? over.map((o, i) => merge(base[i] || {}, o)) : over;
  }
  if (base && over && typeof base === "object" && typeof over === "object" && !Array.isArray(over)) {
    const out = { ...base };
    for (const k in over) out[k] = merge(base[k], over[k]);
    return out;
  }
  return over;
}

  const q = new URLSearchParams(location.search).get("lang");

  return (navigator.languages || [navigator.language]).some(l => /^af\b/i.test(l || "")) ? "af" : "en";
}

/* ---------- language switch ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if (!b || b.dataset.lang === LANG) return;
  LANG = b.dataset.lang;
  try { localStorage.setItem("wv-lang", LANG); } catch (_) {}
  const u = new URL(location.href); u.searchParams.set("lang", LANG); history.replaceState(null, "", u.pathname + u.search + u.hash);
  const y = scrollY; render(); scrollTo(0, y);
  document.querySelector(`[data-lang="${LANG}"]`).focus();
});

/* ---------- copy buttons ---------- */
const toast = $("#toast"); let toastT;
function showToast(msg) { toast.textContent = msg; toast.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove("show"), 1800); }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); return ok;
  }
}
document.addEventListener("click", async e => {
  const b = e.target.closest(".copy-btn"); if (!b) return;
  const ok = await copyText(b.dataset.copy);
  showToast(ok ? T[LANG].copied : T[LANG].copyFail);
  if (ok) { b.dataset.copied = ""; setTimeout(() => delete b.dataset.copied, 1800); }
});

/* ---------- active menu item ---------- */
let io;
function watchSections() {
  if (io) io.disconnect();
  const navLinks = [...document.querySelectorAll(".nav a")];
  io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      navLinks.forEach(a => {
        const on = a.getAttribute("href") === "#" + en.target.id;
        a.setAttribute("aria-current", on ? "true" : "false");
        if (on) a.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
      });
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  SECTION_IDS.forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
}

/* ---------- live weather (Open-Meteo, no key, refreshes itself) ---------- */
// code -> [icon, index into T[lang].wx]
const WX = { 0:["☀️",0],1:["🌤️",1],2:["⛅",2],3:["☁️",3],45:["🌫️",4],48:["🌫️",4],51:["🌦️",5],53:["🌦️",5],55:["🌦️",5],56:["🌧️",6],57:["🌧️",6],
  61:["🌧️",7],63:["🌧️",8],65:["🌧️",9],66:["🌧️",10],67:["🌧️",10],71:["🌨️",11],73:["🌨️",12],75:["❄️",13],77:["🌨️",12],80:["🌦️",14],81:["🌧️",14],82:["⛈️",15],
  85:["🌨️",16],86:["🌨️",16],95:["⛈️",17],96:["⛈️",18],99:["⛈️",18] };
const wxOf = c => { const [i, n] = WX[c] || ["☁️", 3]; return [i, T[LANG].wx[n]]; };
const r0 = n => Math.round(n);
let lastWeather = null;
function renderWeather(d, stale) {
  lastWeather = { d, stale };
  const box = $("#wx"); if (!box) return;
  const t = T[LANG], c = d.current, dl = d.daily, [ic, label] = wxOf(c.weather_code);
  const uv = dl.uv_index_max[0];
  const tips = [];
  if (uv >= 8) tips.push(t.tipUv);
  if (dl.precipitation_probability_max[0] >= 60) tips.push(t.tipRain);
  if (dl.temperature_2m_min[0] <= 3) tips.push(t.tipCold);
  if (dl.temperature_2m_max[0] >= 30) tips.push(t.tipHot);
  box.innerHTML = `
    <div class="wx-now">
      <span class="icon" aria-hidden="true">${ic}</span>
      <div><div class="big">${r0(c.temperature_2m)}°C</div><div class="desc">${esc(label)}</div></div>
    </div>
    <div class="wx-meta">
      <span>${t.today} ${r0(dl.temperature_2m_max[0])}° / ${r0(dl.temperature_2m_min[0])}°</span>
      <span>🌧️ ${t.rain} ${dl.precipitation_probability_max[0] ?? 0}%</span>
      <span>💨 ${t.wind} ${r0(c.wind_speed_10m)} km/h</span>
      <span>☀️ UV ${uv == null ? "–" : r0(uv)}</span>
      <span>🌅 ${String(dl.sunrise[0]).slice(11, 16)} · 🌇 ${String(dl.sunset[0]).slice(11, 16)}</span>
    </div>
    ${tips.length ? `<p class="note ok" style="margin:12px 0 0">${tips.map(esc).join(" ")}</p>` : ""}
    <div class="wx-days" role="list" aria-label="${esc(t.days7)}">
      ${dl.time.map((day, i) => { const [di, dlab] = wxOf(dl.weather_code[i]); const name = i === 0 ? t.today : t.days[new Date(day + "T12:00:00").getDay()];
        return `<div class="wx-day" role="listitem" aria-label="${esc(name)}: ${esc(dlab)}, ${t.high} ${r0(dl.temperature_2m_max[i])}, ${t.low} ${r0(dl.temperature_2m_min[i])}">
          <div class="d">${esc(name)}</div><div class="i" aria-hidden="true">${di}</div>
          <div class="t">${r0(dl.temperature_2m_max[i])}° <span>${r0(dl.temperature_2m_min[i])}°</span></div>
          <div class="r">${dl.precipitation_probability_max[i] ?? 0}%</div></div>`; }).join("")}
    </div>
    <p class="wx-updated">${stale ? t.offline + " " : ""}${t.updated} ${new Date(d._at).toLocaleTimeString(LANG === "af" ? "af-ZA" : "en-ZA", { hour: "2-digit", minute: "2-digit" })} · ${t.by}</p>`;
}
async function loadWeather() {
  const L = GUIDE.location;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${L.weatherLat}&longitude=${L.weatherLon}`
    + "&current=temperature_2m,weather_code,wind_speed_10m"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset"
    + "&timezone=Africa%2FJohannesburg&forecast_days=7";
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const d = await res.json(); d._at = Date.now();
    try { localStorage.setItem("wv-wx", JSON.stringify(d)); } catch (_) {}
    renderWeather(d, false);
  } catch (e) {
    let old = null; try { old = JSON.parse(localStorage.getItem("wv-wx")); } catch (_) {}
    if (old) renderWeather(old, true);
    else if ($("#wx")) $("#wx").innerHTML = `<p>${esc(T[LANG].wxFail)}</p>`;
  }
}

render();
let wxLast = 0;
function maybeWeather() { if (Date.now() - wxLast > 20 * 60 * 1000) { wxLast = Date.now(); loadWeather(); } }
maybeWeather();
setInterval(maybeWeather, 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) maybeWeather(); });
</script>
