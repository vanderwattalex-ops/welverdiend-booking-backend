<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload proof of payment — Welverdiend Accommodation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --taupe:#8A7E68; --taupe-dark:#6B6151; --taupe-deep:#4A4436;
    --ink:#2B2A26; --ink-soft:#66604F; --line:#E5E0D2; --surface:#FAF8F3;
    --white:#FFFFFF; --danger:#A3402F; --success:#4B6B3C;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--surface);color:var(--ink);margin:0;padding:32px 16px;}
  .wrap{max-width:480px;margin:0 auto;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:32px;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;color:var(--taupe-deep);margin:0 0 4px;}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 20px;}
  .summary{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:20px;font-size:13.5px;}
  .summary-line{display:flex;justify-content:space-between;padding:3px 0;color:var(--ink-soft);}
  .summary-total{display:flex;justify-content:space-between;font-weight:600;font-size:16px;color:var(--ink);border-top:1px solid var(--line);padding-top:8px;margin-top:6px;}
  .bank{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:20px;font-size:13px;line-height:1.6;}
  .bank b{color:var(--taupe-deep);}
  .file-drop{border:1.5px dashed var(--line);border-radius:6px;padding:20px;text-align:center;font-size:13px;color:var(--ink-soft);cursor:pointer;margin-bottom:16px;}
  .file-drop.has-file{border-color:var(--taupe);color:var(--ink);}
  .btn{width:100%;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;background:var(--taupe-deep);color:var(--white);border:none;padding:12px;border-radius:6px;cursor:pointer;}
  .btn:hover{background:var(--ink);}
  .btn:disabled{background:var(--line);cursor:not-allowed;}
  .msg{font-size:13px;margin-top:12px;text-align:center;}
  .msg.error{color:var(--danger);}
  .msg.success{color:var(--success);}
  .state-note{font-size:14px;color:var(--ink-soft);text-align:center;padding:20px 0;}
  .whatsapp-float{
    position:fixed;bottom:22px;right:22px;z-index:500;
    width:58px;height:58px;border-radius:50%;
    background:#25D366;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.25);text-decoration:none;
    transition:transform .15s ease;
  }
  .whatsapp-float:hover{transform:scale(1.08);}
  .whatsapp-float svg{width:30px;height:30px;fill:#fff;}
  .pet-friendly-stamp{
    position:fixed;bottom:22px;left:22px;z-index:499;
    width:100px;height:auto;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.28));
    transform:rotate(-6deg);
    transition:transform .2s ease;
  }
  .pet-friendly-stamp:hover{transform:rotate(-6deg) scale(1.07);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Payment for your stay</h1>
  <p class="sub">Welverdiend Accommodation</p>
  <div id="content">
    <p class="state-note">Loading your booking details…</p>
  </div>
</div>

<script>
(function(){
  const API_BASE = "https://welverdiend-booking-478269051372.europe-west1.run.app";

  const params = new URLSearchParams(window.location.search);
  const bookingId = params.get("booking");
  const content = document.getElementById("content");
  const rand = n => `R${Number(n||0).toFixed(2)}`;
  let selectedFile = null;

  if(!bookingId){
    content.innerHTML = `<p class="state-note">This link is missing a booking reference — please use the link from your email.</p>`;
    return;
  }

  async function load(){
    try{
      const [summaryRes, configRes] = await Promise.all([
        fetch(`${API_BASE}/api/bookings/${bookingId}/summary`).then(r => r.json()),
        fetch(`${API_BASE}/api/config`).then(r => r.json())
      ]);
      const data = summaryRes;
      const bankDetails = configRes.ok ? configRes.bankDetails : "Contact us for our banking details.";
      if(!data.ok){
        content.innerHTML = `<p class="state-note">We couldn't find that booking. Please check the link from your email, or contact us directly.</p>`;
        return;
      }

      // Which stage are we in?
      if(data.status === "awaiting_payment"){
        renderPaymentStep({
          heading: "Pay your deposit",
          amountLabel: "Deposit due now",
          amount: data.depositAmount,
          note: `The remaining ${rand(data.balanceAmount)} balance is due before check-in — we'll email you separately for that closer to your stay.`,
          bankDetails,
          uploadUrl: `${API_BASE}/api/bookings/${bookingId}/proof`,
          data
        });
      } else if(data.status === "submitted"){
        content.innerHTML = `<p class="state-note">Thanks — your deposit proof of payment has already been received. We'll be in touch with final confirmation shortly.</p>`;
      } else if(data.status === "confirmed" && data.balanceStatus === "unpaid"){
        renderPaymentStep({
          heading: "Pay your final balance",
          amountLabel: "Balance due before check-in",
          amount: data.balanceAmount,
          note: `Your booking is confirmed — this is the remaining balance, due before you check in.`,
          bankDetails,
          uploadUrl: `${API_BASE}/api/bookings/${bookingId}/balance-proof`,
          data
        });
      } else if(data.status === "confirmed" && data.balanceStatus === "submitted"){
        content.innerHTML = `<p class="state-note">Thanks — your final payment proof has already been received. We'll confirm shortly.</p>`;
      } else if(data.status === "confirmed" && data.balanceStatus === "paid"){
        content.innerHTML = `<p class="state-note">You're all paid up — we look forward to hosting you!</p>`;
      } else {
        content.innerHTML = `<p class="state-note">There's no payment currently due for this booking.</p>`;
      }
    }catch(err){
      content.innerHTML = `<p class="state-note">Could not load your booking right now — please refresh, or contact us directly.</p>`;
    }
  }

  function renderPaymentStep({ heading, amountLabel, amount, note, bankDetails, uploadUrl, data }){
    document.querySelector("h1").textContent = heading;
    content.innerHTML = `
      <div class="summary">
        <div class="summary-line"><span>${data.unitName}</span><span>${data.checkIn} → ${data.checkOut}</span></div>
        <div class="summary-total"><span>${amountLabel}</span><span>${rand(amount)}</span></div>
      </div>
      <div class="bank"><b>Pay by EFT to:</b><br>${bankDetails}<br><br>${note}</div>
      <div class="file-drop" id="file-drop">Click to upload a screenshot or PDF of your EFT payment</div>
      <input type="file" id="file-input" accept="image/*,application/pdf" style="display:none">
      <button class="btn" id="submit-btn">Submit proof of payment</button>
      <div class="msg" id="msg"></div>
    `;

    const fileDrop = document.getElementById("file-drop");
    const fileInput = document.getElementById("file-input");
    fileDrop.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const f = e.target.files[0];
      if(f){
        selectedFile = f;
        fileDrop.textContent = `Selected: ${f.name}`;
        fileDrop.classList.add("has-file");
      }
    };

    document.getElementById("submit-btn").onclick = async () => {
      const msg = document.getElementById("msg");
      const btn = document.getElementById("submit-btn");
      msg.className = "msg";
      msg.textContent = "";
      if(!selectedFile){
        msg.className = "msg error";
        msg.textContent = "Please attach your proof of payment first.";
        return;
      }
      btn.disabled = true; btn.textContent = "Uploading…";
      try{
        const fd = new FormData();
        fd.append("proof", selectedFile);
        const res = await fetch(uploadUrl, { method: "POST", body: fd });
        const result = await res.json();
        if(result.ok){
          msg.className = "msg success";
          msg.textContent = result.message;
          btn.style.display = "none";
          fileDrop.style.display = "none";
        } else {
          msg.className = "msg error";
          msg.textContent = result.error || "Something went wrong — please try again.";
          btn.disabled = false; btn.textContent = "Submit proof of payment";
        }
      }catch(err){
        msg.className = "msg error";
        msg.textContent = "Could not reach the server — please try again shortly.";
        btn.disabled = false; btn.textContent = "Submit proof of payment";
      }
    };
  }

  load();
})();
</script>

</body>
</html>
